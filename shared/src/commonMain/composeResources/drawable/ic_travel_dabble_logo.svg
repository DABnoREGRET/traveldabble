<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tropicalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Sun Radial Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Sail Gradient -->
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Wave/Accent Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Tropical Rounded Badge Background -->
  <rect width="100" height="100" rx="26" fill="url(#tropicalBg)" filter="url(#logoShadow)" />

  <!-- Tropical Warm Setting Sun between Tree and Boat -->
  <circle cx="52" cy="32" r="10" fill="url(#sunGlow)" />

  <!-- ========================================== -->
  <!-- LETTER "T" — TROPICAL PALM TREE           -->
  <!-- ========================================== -->

  <!-- Small Island Shore Mound for the Palm Tree -->
  <path d="M 16 76 C 22 73 36 73 44 76 C 36 77.5 22 77.5 16 76 Z" fill="#F59E0B" fill-opacity="0.6" />

  <!-- Palm Tree Trunk (The Vertical Stem of T) -->
  <path d="M 27.5 74 C 29.5 62 29 50 31.5 38 L 35.5 38 C 33 50 33.5 62 31.5 74 Z" fill="#FFFFFF" />

  <!-- Palm Tree Fronds (The Horizontal Crossbar of T) -->
  <!-- Top Center Frond -->
  <path d="M 33.5 39 C 32 30 35 22 33.5 18 C 36 23 37 31 33.5 39 Z" fill="#34D399" />
  
  <!-- Left Arching Frond (Forms Left Arm of T) -->
  <path d="M 33.5 38 C 26 34 18 33 13 36 C 18 39 26 39 33.5 40 Z" fill="#10B981" />
  <path d="M 33.5 38 C 24 30 17 28 14 31 C 18 34 25 34 33.5 39 Z" fill="#34D399" />
  <path d="M 33.5 40 C 23 41 16 45 13 50 C 18 47 25 44 33.5 41 Z" fill="#059669" />

  <!-- Right Arching Frond (Forms Right Arm of T) -->
  <path d="M 33.5 38 C 41 34 47 33 51 36 C 47 39 40 39 33.5 40 Z" fill="#10B981" />
  <path d="M 33.5 38 C 42 30 48 28 50 31 C 47 34 41 34 33.5 39 Z" fill="#34D399" />
  <path d="M 33.5 40 C 42 42 47 46 49 51 C 45 47 40 44 33.5 41 Z" fill="#059669" />

  <!-- Golden Coconuts Cluster at Palm Crown -->
  <circle cx="31.5" cy="40" r="1.8" fill="#F59E0B" />
  <circle cx="35" cy="40" r="1.8" fill="#FBBF24" />
  <circle cx="33.5" cy="42" r="1.6" fill="#D97706" />

  <!-- ========================================== -->
  <!-- LETTER "D" — TROPICAL SAILBOAT            -->
  <!-- ========================================== -->

  <!-- Boat Mast (The Vertical Spine of D) -->
  <path d="M 54.5 28 L 57.5 28 L 57.5 73 L 54.5 73 Z" fill="#FFFFFF" />

  <!-- Golden Wind Pennant atop Mast -->
  <path d="M 57.5 28 L 64 30.5 L 57.5 33 Z" fill="#F59E0B" />

  <!-- Main Sail (The Curved Outer Loop of D) -->
  <path d="M 57.5 33 C 68 35 79 44 79 54.5 C 79 65 68 71 57.5 72 L 57.5 33 Z" fill="url(#sailGrad)" />

  <!-- Inner Cutout Window of D (Open Cabin / Sail Airflow) -->
  <path d="M 61 41 C 68 43 73 48 73 54.5 C 73 61 68 64.5 61 65.5 Z" fill="#047857" />

  <!-- Dynamic Tropical Ocean Breeze Stripe on Sail -->
  <path d="M 61 51 C 66 49 71 51 74 54 C 70 56 65 55 61 56 Z" fill="url(#waveGrad)" />

  <!-- Sleek Boat Hull (Base of D) -->
  <path d="M 48 73 L 78 73 C 79 73 80 74 79.5 75 C 77 78 69 80 56 80 C 47 80 47 75 48 73 Z" fill="#FFFFFF" />
  <!-- Hull Waterline Accent -->
  <path d="M 50 76.5 C 60 76.5 72 75.5 77 74.5" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- ========================================== -->
  <!-- TROPICAL OCEAN WAVES & REFLECTIONS         -->
  <!-- ========================================== -->
  <path d="M 18 82 C 28 80 38 84 48 81.5 C 58 79 68 83 78 81 C 82 80 85 81.5 87 83" fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 28 87 C 38 85.5 48 88 58 86.5 C 68 85 76 87.5 82 86.5" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.65" />
</svg>
